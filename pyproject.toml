[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Utan detta hittar inte `pytest` (som kommando) paketet src/ - bara `python -m pytest` gör det.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = [
    "error",
    # Kommer från scipy via sklearns LogisticRegression, inte från vår kod.
    "ignore:scipy.optimize:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
